name: Build Desktop & Mobile Apps

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v63)'
        required: true
        default: 'v63'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows PC App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Desktop Web Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/www | Out-Null
          $items = @('index.html', 'style.css', 'script.js', 'sw.js', 'app-links.js', 'firebase-config.js', 'manifest.json', 'icons')
          foreach ($it in $items) {
            if (Test-Path $it) { Copy-Item -Recurse -Force $it desktop/www/ }
          }

      - name: Install Electron & Build Windows Setup (.exe)
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win nsis

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DreamX-Desktop-Setup
          path: desktop/dist/DreamX-Desktop-Setup.exe

  build-android:
    name: Build Android Mobile App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Mobile Web Bundle
        run: |
          mkdir -p mobile/www
          for f in index.html style.css script.js sw.js app-links.js firebase-config.js manifest.json; do
            [ -f "$f" ] && cp "$f" mobile/www/
          done
          [ -d icons ] && cp -r icons mobile/www/
          cp capacitor.config.json mobile/capacitor.config.json

      - name: Build Android APK via Capacitor
        working-directory: mobile
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../DreamX-Mobile.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DreamX-Mobile-APK
          path: mobile/DreamX-Mobile.apk

  publish-release:
    name: Publish to GitHub Releases (Latest)
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: DreamX-Desktop-Setup
          path: release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: DreamX-Mobile-APK
          path: release-assets

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || 'v63' }}
          name: DreamX Trading Hub ${{ github.event.inputs.version_tag || 'v63' }}
          body: |
            ## DreamX Trading Hub ${{ github.event.inputs.version_tag || 'v63' }} — Desktop & Mobile Apps
            - Includes all updates up to **v63** (Live Sync + Offline Fallback, Real-Time Live Users & Admin Analytics, Free Right-Side Panning, TradingView Chart Types, TPO/SVP/Footprint/CVD, Pine Script Engine & Libraries).
            - **Auto-Sync Enabled:** Future web updates automatically sync inside both PC & Mobile apps!
          files: |
            release-assets/DreamX-Desktop-Setup.exe
            release-assets/DreamX-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
